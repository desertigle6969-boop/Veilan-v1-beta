name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /usr/local/lib/android/sdk/cmdline-tools
          sudo curl -sL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q commandlinetools.zip
          sudo rm commandlinetools.zip
          sudo mv cmdline-tools latest || true
          mkdir -p latest
          mv latest/* latest/ 2>/dev/null || true
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova project
        run: |
          mkdir -p cordova-project
          cd cordova-project
          cordova create app com.veilan.game Veilan
          cd app
          rm -rf www/*
          cp -r $GITHUB_WORKSPACE/* www/ 2>/dev/null || true
          rm -rf www/.git www/.github www/cordova-project www/res
          # Копируем иконки и splash в ресурсы Cordova
          mkdir -p res/android res/splash
          cp $GITHUB_WORKSPACE/res/android/*.png res/android/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/res/splash/*.png res/splash/ 2>/dev/null || true
          cordova platform add android

      - name: Add icons and splash to config.xml
        run: |
          cd cordova-project/app
          python3 << 'PYEOF'
          import re
          with open('config.xml', 'r') as f:
              xml = f.read()
          # Вставляем теги иконок и splash внутрь <platform name="android">
          icons = '''
              <icon density="ldpi" src="res/android/ldpi.png" />
              <icon density="mdpi" src="res/android/mdpi.png" />
              <icon density="hdpi" src="res/android/hdpi.png" />
              <icon density="xhdpi" src="res/android/xhdpi.png" />
              <icon density="xxhdpi" src="res/android/xxhdpi.png" />
              <icon density="xxxhdpi" src="res/android/xxxhdpi.png" />
              <splash density="port-xxxhdpi" src="res/splash/splash-2732.png" />
              <splash density="land-xxxhdpi" src="res/splash/splash-2732.png" />
          '''
          # Ищем <platform name="android"> и вставляем после него
          if '<platform name="android">' in xml:
              xml = xml.replace('<platform name="android">', '<platform name="android">' + icons, 1)
          else:
              # Если секции нет — добавляем перед </widget>
              xml = xml.replace('</widget>', '  <platform name="android">' + icons + '  </platform>\n</widget>', 1)
          with open('config.xml', 'w') as f:
              f.write(xml)
          print("Иконки и splash добавлены в config.xml")
          PYEOF

      - name: Build APK
        run: |
          cd cordova-project/app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veilan-apk
          path: cordova-project/app/platforms/android/app/build/outputs/apk/**/*.apk
