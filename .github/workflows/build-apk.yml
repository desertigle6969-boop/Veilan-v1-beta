name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova project
        run: |
          mkdir -p cordova-project
          cd cordova-project
          cordova create app com.veilan.game Veilan
          cd app
          rm -rf www/*
          cp -r $GITHUB_WORKSPACE/* www/ 2>/dev/null || true
          rm -rf www/.git www/.github www/cordova-project
          cordova platform add android

      - name: Build APK
        run: |
          cd cordova-project/app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veilan-apk
          path: cordova-project/app/platforms/android/app/build/outputs/apk/**/*.apk
