name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /usr/local/lib/android/sdk/cmdline-tools
          sudo curl -sL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q commandlinetools.zip
          sudo rm commandlinetools.zip
          sudo mv cmdline-tools latest || true
          mkdir -p latest
          mv latest/* latest/ 2>/dev/null || true
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova project
        run: |
          mkdir -p cordova-project
          cd cordova-project
          cordova create app com.veilan.game Veilan
          cd app
          rm -rf www/*
          cp -r $GITHUB_WORKSPACE/* www/ 2>/dev/null || true
          rm -rf www/.git www/.github www/cordova-project www/res
          cordova plugin add cordova-plugin-splashscreen
          cordova platform add android

      - name: Configure splash and icons in config.xml
        run: |
          cd cordova-project/app
          python3 << 'PYEOF'
          with open('config.xml', 'r') as f:
              xml = f.read()
          # Preferences для splash
          prefs = '''
              <preference name="SplashScreen" value="screen" />
              <preference name="SplashScreenDelay" value="3000" />
              <preference name="AutoHideSplashScreen" value="true" />
              <preference name="FadeSplashScreen" value="true" />
              <preference name="FadeSplashScreenDuration" value="500" />
              <preference name="ShowSplashScreenSpinner" value="false" />
          '''
          if '<preference name="SplashScreen"' not in xml:
              xml = xml.replace('</widget>', prefs + '</widget>', 1)
          with open('config.xml', 'w') as f:
              f.write(xml)
          print("Preferences добавлены")
          PYEOF

      - name: Replace icons in mipmap folders
        run: |
          cd cordova-project/app/platforms/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          rm -rf mipmap-*-v26
          find . -name "ic_launcher.xml" -delete
          find . -name "ic_launcher_round.xml" -delete
          rm -f mipmap-*/ic_launcher_foreground.png
          rm -f mipmap-*/ic_launcher_background.png
          rm -f mipmap-*/ic_launcher_round.png
          for d in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -d "mipmap-$d" ]; then
              cp $GITHUB_WORKSPACE/res/android/$d.png mipmap-$d/ic_launcher.png
              cp $GITHUB_WORKSPACE/res/android/$d.png mipmap-$d/ic_launcher_round.png
              cp $GITHUB_WORKSPACE/res/android/$d.png mipmap-$d/ic_launcher_foreground.png
            fi
          done
          echo "Иконки заменены"

      - name: Replace splash screens
        run: |
          cd cordova-project/app/platforms/android/app/src/main/res
          for d in drawable drawable-land-hdpi drawable-land-ldpi drawable-land-mdpi drawable-land-xhdpi drawable-land-xxhdpi drawable-land-xxxhdpi drawable-port-hdpi drawable-port-ldpi drawable-port-mdpi drawable-port-xhdpi drawable-port-xxhdpi drawable-port-xxxhdpi; do
            if [ -d "$d" ]; then
              cp $GITHUB_WORKSPACE/res/splash/splash-2732.png "$d/screen.png" 2>/dev/null || true
              cp $GITHUB_WORKSPACE/res/splash/splash-2732.png "$d/splash.png" 2>/dev/null || true
            fi
          done
          echo "Splash заменён (screen.png + splash.png)"

      - name: Build APK
        run: |
          cd cordova-project/app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veilan-apk
          path: cordova-project/app/platforms/android/app/build/outputs/apk/**/*.apk
