<script>
  // Скрытие HTML-splash через 2 секунды или при загрузке игры
  (function() {
    function hideSplash() {
      var el = document.getElementById('html-splash');
      if (el && !el.classList.contains('hidden-splash')) {
        el.classList.add('hidden-splash');
        setTimeout(function() { el.style.display = 'none'; }, 700);
      }
    }
    // Скрываем через 2 секунды (минимум показа)
    setTimeout(hideSplash, 2000);
    // Или когда игра готова
    window.addEventListener('load', function() {
      setTimeout(hideSplash, 1500);
    });
  })();
</script>
